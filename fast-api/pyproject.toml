[project]
name = "fastapi-quickstart"
version = "1.0.0"
description = "HR Skills API demonstrating FastAPI routers, middleware, CORS, and dependency injection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so `from app.main import app` resolves from any cwd

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]
